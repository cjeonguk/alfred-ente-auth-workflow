# Builds dist/ente-auth.alfredworkflow and publishes it as a GitHub Release
# whenever a version tag (v1.2.3, v1.3.0-beta.1, ...) is pushed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # build.sh is zsh, and validation needs plutil and osascript.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a version like v1.2.3"
            exit 1
          fi
          plutil -replace version -string "$version" src/info.plist

      - name: Validate
        run: |
          plutil -lint src/info.plist
          # Without the ente CLI the script must still run and report an error item.
          output=$(ente_path=/nonexistent src/ente-auth.js list)
          echo "$output"
          grep -q '"title":"Ente Auth error"' <<< "$output"

      - name: Build
        run: scripts/build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/ente-auth.alfredworkflow \
            --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"
